<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ElementsWar · 地图编辑器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #07090d; color: #dfe6f2; font-family: "Microsoft YaHei", system-ui, sans-serif; height: 100vh; overflow: hidden; }
  #wrap { display: flex; height: 100vh; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; }
  canvas { background: #12161f; border-radius: 6px; box-shadow: 0 0 0 1px #1e2430, 0 20px 60px rgba(0,0,0,.7); cursor: crosshair; max-width: 100%; max-height: 94vh; }
  #side { width: 300px; background: #0d1119; border-left: 1px solid #1e2836; padding: 16px; overflow-y: auto; }
  h1 { font-size: 19px; margin-bottom: 4px; color: #8fe3d4; }
  .sub { font-size: 11.5px; color: #6f7f99; margin-bottom: 14px; line-height: 1.6; }
  .tool { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .tool button, .act button {
    flex: 1; min-width: 62px; padding: 8px 6px; font-size: 12px; font-family: inherit; cursor: pointer;
    background: #141b27; border: 1px solid #26303f; border-radius: 7px; color: #cfd8e8; transition: .12s;
  }
  .tool button.on { background: #12262a; border-color: #4dd8c0; color: #8fe3d4; }
  .tool button:hover, .act button:hover { border-color: #3c4c63; }
  .act { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .act button.primary { background: linear-gradient(180deg,#2a6f65,#1d4d47); border-color: #3c9d8c; color: #d8fff6; font-weight: 700; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: #a8b4c8; margin: 9px 0; }
  select, input[type=number], input[type=text] {
    background: #111823; border: 1px solid #222c3b; color: #dfe6f2; border-radius: 6px;
    padding: 5px 8px; font-family: inherit; font-size: 12.5px; width: 96px;
  }
  .hint { font-size: 11.5px; color: #6f7f99; line-height: 1.7; margin-top: 8px; }
  .warn { color: #ffb35c; }
  hr { border: none; border-top: 1px solid #1a2331; margin: 12px 0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="side">
    <h1>地图编辑器</h1>
    <p class="sub">左键绘制 · 右键擦除 · 拖拽连续绘制<br>打开时是<b>空白地图</b>，需要自己载入之前的存档</p>

    <div class="tool">
      <button data-tool="1" class="on">墙体</button>
      <button data-tool="2">水坑</button>
      <button data-tool="3">火药桶</button>
      <button data-tool="4">出生点</button>
      <button data-tool="0">橡皮</button>
    </div>

    <label>编辑对称
      <select id="sym">
        <option value="none">不镜像</option>
        <option value="mirror" selected>左右镜像</option>
        <option value="point">中心对称</option>
      </select>
    </label>

    <hr>
    <label>地图宽度 <select id="cols"></select></label>
    <label>地图高度 <select id="rows"></select></label>
    <p class="hint">修改尺寸会清空当前绘制</p>

    <hr>
    <label>人数
      <select id="teamSize">
        <option value="1">1v1</option>
        <option value="3">3v3</option>
        <option value="5" selected>5v5</option>
      </select>
    </label>
    <label>目标人头 <input type="number" id="killTarget" value="30" min="5" max="200"></label>
    <label>地图名 <input type="text" id="mapName" value="我的地图"></label>

    <div class="act">
      <button id="btnSave" class="primary">保存并试玩</button>
      <button id="btnSaveOnly">仅保存</button>
    </div>
    <div class="act">
      <button id="btnClear">清空</button>
      <button id="btnLoad">载入存档</button>
      <button id="btnExport">导出</button>
      <button id="btnImport">导入</button>
    </div>

    <div class="hint" id="status">未保存</div>
    <hr>
    <p class="hint">墙体挡子弹与视线；水坑是永久水源；火药桶可被打爆。<br>出生点决定基地位置，会自动生成带门的房间。</p>
  </div>
</div>
<script>
(function () {
  var CELL = 30;
  var COLS = 40, ROWS = 24;
  var SC = 0.8;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var cells = new Uint8Array(COLS * ROWS);
  var tool = 1, sym = 'mirror', spawnRow = 12, painting = 0;

  // 尺寸下拉
  var selCols = document.getElementById('cols'), selRows = document.getElementById('rows');
  for (var c = 24; c <= 64; c += 4) selCols.add(new Option(c + ' 格', c));
  for (var r = 16; r <= 40; r += 4) selRows.add(new Option(r + ' 格', r));
  selCols.value = String(COLS);
  selRows.value = String(ROWS);

  function idx(x, y) { return y * COLS + x; }
  function inb(x, y) { return x >= 0 && y >= 0 && x < COLS && y < ROWS; }

  function resize(cols, rows) {
    COLS = cols; ROWS = rows;
    cells = new Uint8Array(COLS * ROWS);
    spawnRow = Math.floor(ROWS / 2);
    cv.width = Math.round(COLS * CELL * SC);
    cv.height = Math.round(ROWS * CELL * SC);
    draw();
  }

  function paint(x, y, val) {
    if (!inb(x, y)) return;
    cells[idx(x, y)] = val;
    if (sym === 'mirror') {
      var mx = COLS - 1 - x;
      if (inb(mx, y)) cells[idx(mx, y)] = val;
    } else if (sym === 'point') {
      var px = COLS - 1 - x, py = ROWS - 1 - y;
      if (inb(px, py)) cells[idx(px, py)] = val;
    }
    if (val === 4) spawnRow = y;
  }

  function cs() { return CELL * SC; }

  function draw() {
    var C = cs();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#12161f';
    ctx.fillRect(0, 0, cv.width, cv.height);

    ctx.strokeStyle = 'rgba(46,53,71,0.7)';
    ctx.lineWidth = 1;
    for (var x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * C, 0); ctx.lineTo(x * C, ROWS * C); ctx.stroke();
    }
    for (var y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * C); ctx.lineTo(COLS * C, y * C); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(80,92,120,0.5)';
    ctx.setLineDash([8, 10]);
    ctx.beginPath(); ctx.moveTo(COLS / 2 * C, 0); ctx.lineTo(COLS / 2 * C, ROWS * C); ctx.stroke();
    if (sym === 'point') {
      ctx.beginPath(); ctx.moveTo(0, ROWS / 2 * C); ctx.lineTo(COLS * C, ROWS / 2 * C); ctx.stroke();
    }
    ctx.setLineDash([]);

    for (var yy = 0; yy < ROWS; yy++) {
      for (var xx = 0; xx < COLS; xx++) {
        var v = cells[idx(xx, yy)];
        if (!v) continue;
        var px = xx * C, py = yy * C;
        if (v === 1) {
          ctx.fillStyle = '#5b6479';
          ctx.fillRect(px + 1, py + 1, C - 2, C - 2);
          ctx.strokeStyle = 'rgba(160,172,198,0.5)';
          ctx.strokeRect(px + 1.5, py + 1.5, C - 3, C - 3);
        } else if (v === 2) {
          ctx.fillStyle = 'rgba(70,150,215,0.55)';
          ctx.fillRect(px + 1, py + 1, C - 2, C - 2);
        } else if (v === 3) {
          ctx.fillStyle = '#c2703d';
          ctx.beginPath(); ctx.arc(px + C / 2, py + C / 2, C * 0.34, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = 'rgba(255,190,120,0.8)';
          ctx.stroke();
        } else if (v === 4) {
          ctx.fillStyle = 'rgba(90,230,210,0.35)';
          ctx.fillRect(px + 1, py + 1, C - 2, C - 2);
          ctx.strokeStyle = 'rgba(90,230,210,0.9)';
          ctx.setLineDash([4, 3]);
          ctx.strokeRect(px + 2, py + 2, C - 4, C - 4);
          ctx.setLineDash([]);
        }
      }
    }
    ctx.fillStyle = 'rgba(90,230,210,0.10)';
    ctx.fillRect(0, spawnRow * C, COLS * C, C);

    // 重生房间预览（与游戏内自动生成的房间一致）
    var roomX0 = 24, roomX1 = Math.max(324, 170 + 110);
    var cyWorld = spawnRow * CELL + CELL / 2;
    var ry0 = Math.round(cyWorld - 150), ry1 = ry0 + 300;
    var WW = COLS * CELL;
    [[roomX0, roomX1], [WW - roomX1, WW - roomX0]].forEach(function (r) {
      ctx.fillStyle = 'rgba(90,230,210,0.06)';
      ctx.fillRect(r[0] * SC, ry0 * SC, (r[1] - r[0]) * SC, (ry1 - ry0) * SC);
      ctx.strokeStyle = 'rgba(90,230,210,0.55)';
      ctx.setLineDash([6, 5]);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(r[0] * SC, ry0 * SC, (r[1] - r[0]) * SC, (ry1 - ry0) * SC);
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(140,240,220,0.8)';
      ctx.font = '11px "Microsoft YaHei",sans-serif';
      ctx.fillText('重生房间（自动生成）', r[0] * SC + 6, ry0 * SC + 14);
    });

    var w = 0, p = 0, b = 0, s = 0;
    for (var i = 0; i < cells.length; i++) {
      if (cells[i] === 1) w++; else if (cells[i] === 2) p++;
      else if (cells[i] === 3) b++; else if (cells[i] === 4) s++;
    }
    document.getElementById('status').textContent =
      COLS + '×' + ROWS + ' 格（' + (COLS * CELL) + '×' + (ROWS * CELL) + '）· 墙体 ' + w +
      ' · 水坑 ' + p + ' · 桶 ' + b + ' · 出生 ' + s;
  }

  function cellAt(e) {
    var r = cv.getBoundingClientRect();
    var C = cs();
    return {
      x: Math.floor((e.clientX - r.left) * (cv.width / r.width) / C),
      y: Math.floor((e.clientY - r.top) * (cv.height / r.height) / C)
    };
  }

  cv.addEventListener('mousedown', function (e) {
    e.preventDefault();
    painting = e.button === 2 ? -1 : tool;
    var c = cellAt(e);
    paint(c.x, c.y, painting === -1 ? 0 : painting);
    draw();
  });
  cv.addEventListener('mousemove', function (e) {
    if (!painting) return;
    var c = cellAt(e);
    paint(c.x, c.y, painting === -1 ? 0 : painting);
    draw();
  });
  window.addEventListener('mouseup', function () { painting = 0; });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.querySelectorAll('.tool button').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('.tool button').forEach(function (o) { o.classList.remove('on'); });
      b.classList.add('on');
      tool = parseInt(b.dataset.tool, 10);
    };
  });

  document.getElementById('sym').onchange = function (e) { sym = e.target.value; draw(); };
  selCols.onchange = function () {
    if (!confirm('修改宽度会清空当前绘制，继续？')) { selCols.value = String(COLS); return; }
    resize(parseInt(selCols.value, 10), ROWS);
  };
  selRows.onchange = function () {
    if (!confirm('修改高度会清空当前绘制，继续？')) { selRows.value = String(ROWS); return; }
    resize(COLS, parseInt(selRows.value, 10));
  };

  function mergeRects(type) {
    var used = new Uint8Array(COLS * ROWS), out = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var i = idx(x, y);
        if (used[i] || cells[i] !== type) continue;
        var w = 0;
        while (x + w < COLS && !used[idx(x + w, y)] && cells[idx(x + w, y)] === type) w++;
        var h = 1, ok = true;
        while (y + h < ROWS && ok) {
          for (var k = 0; k < w; k++) {
            if (used[idx(x + k, y + h)] || cells[idx(x + k, y + h)] !== type) { ok = false; break; }
          }
          if (ok) h++;
        }
        for (var yy = 0; yy < h; yy++) for (var xx = 0; xx < w; xx++) used[idx(x + xx, y + yy)] = 1;
        out.push([x * CELL, y * CELL, (x + w) * CELL, (y + h) * CELL]);
      }
    }
    return out;
  }

  function buildDef() {
    var barrels = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (cells[idx(x, y)] === 3) barrels.push([x * CELL + CELL / 2, y * CELL + CELL / 2]);
      }
    }
    var teamSize = parseInt(document.getElementById('teamSize').value, 10);
    var killTarget = parseInt(document.getElementById('killTarget').value, 10) || 30;
    var baseY = spawnRow * CELL + CELL / 2;
    var ys = [];
    for (var i = 0; i < teamSize; i++) ys.push(Math.round(baseY + (i - (teamSize - 1) / 2) * 55));
    return {
      name: document.getElementById('mapName').value || '我的地图',
      w: COLS * CELL, h: ROWS * CELL, noMirror: true,
      covers: mergeRects(1), puddles: mergeRects(2), barrels: barrels,
      spawnX: 170, spawnY: ys, teamSize: teamSize, killTarget: killTarget
    };
  }

  function save() {
    var def = buildDef();
    if (!def.covers.length && !def.barrels.length) { alert('至少画一点东西吧'); return null; }
    localStorage.setItem('elementswar.map', JSON.stringify(def));
    return def;
  }

  function loadInto(def) {
    if (def.w && def.h) {
      var c = Math.max(24, Math.min(64, Math.round(def.w / CELL)));
      var r = Math.max(16, Math.min(40, Math.round(def.h / CELL)));
      if (c !== COLS || r !== ROWS) { COLS = c; ROWS = r; cells = new Uint8Array(COLS * ROWS); }
      selCols.value = String(COLS); selRows.value = String(ROWS);
      cv.width = Math.round(COLS * CELL * SC);
      cv.height = Math.round(ROWS * CELL * SC);
    }
    cells.fill(0);
    (def.covers || []).forEach(function (q) {
      for (var x = Math.floor(q[0] / CELL); x < Math.ceil(q[2] / CELL); x++)
        for (var y = Math.floor(q[1] / CELL); y < Math.ceil(q[3] / CELL); y++)
          if (inb(x, y)) cells[idx(x, y)] = 1;
    });
    (def.puddles || []).forEach(function (q) {
      for (var x = Math.floor(q[0] / CELL); x < Math.ceil(q[2] / CELL); x++)
        for (var y = Math.floor(q[1] / CELL); y < Math.ceil(q[3] / CELL); y++)
          if (inb(x, y)) cells[idx(x, y)] = 2;
    });
    (def.barrels || []).forEach(function (b) {
      var x = Math.floor(b[0] / CELL), y = Math.floor(b[1] / CELL);
      if (inb(x, y)) cells[idx(x, y)] = 3;
    });
    if (def.spawnY) spawnRow = Math.floor(def.spawnY[0] / CELL);
    if (def.name) document.getElementById('mapName').value = def.name;
    if (def.teamSize) document.getElementById('teamSize').value = def.teamSize;
    if (def.killTarget) document.getElementById('killTarget').value = def.killTarget;
    draw();
  }

  document.getElementById('btnSave').onclick = function () {
    var d = save();
    if (d) window.open('index.html#play=custom', '_blank');
  };
  document.getElementById('btnSaveOnly').onclick = function () {
    var d = save();
    if (d) document.getElementById('status').innerHTML =
      '<span class="warn">已保存：</span>' + d.name + ' · 掩体 ' + d.covers.length + ' 块';
  };
  document.getElementById('btnClear').onclick = function () {
    if (!confirm('清空当前地图？')) return;
    cells.fill(0); draw();
  };
  document.getElementById('btnLoad').onclick = function () {
    try {
      var raw = localStorage.getItem('elementswar.map');
      if (!raw) { alert('没有找到存档'); return; }
      loadInto(JSON.parse(raw));
    } catch (e) { alert('存档读取失败'); }
  };
  document.getElementById('btnExport').onclick = function () {
    var ta = document.createElement('textarea');
    ta.value = JSON.stringify(buildDef());
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); alert('已复制到剪贴板'); } catch (e) { alert('复制失败'); }
    ta.remove();
  };
  document.getElementById('btnImport').onclick = function () {
    var s2 = prompt('粘贴地图 JSON');
    if (!s2) return;
    try { loadInto(JSON.parse(s2)); } catch (e) { alert('JSON 解析失败'); }
  };

  resize(COLS, ROWS);
})();
</script>
</body>
</html>
